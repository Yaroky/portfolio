name: Подписчики для /links

on:
  schedule:
    - cron: "0 3 * * *"  # каждый день в 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - name: Сохранить, если подписи изменились
        run: |
          if git diff --quiet -- stats.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Сайт"
          git push
